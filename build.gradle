// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.23'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// NOTE: Removed a late-time runtime workaround that attempted to disable
// Kotlin build statistics during project evaluation. Setting the property
// in gradle.properties ensures it is available early in the Gradle JVM and
// prevents BuildFlowService from being registered/serialized.

task clean(type: Delete) {
    delete rootProject.buildDir
}
